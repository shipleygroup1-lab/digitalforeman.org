<!doctype html>
<html lang="en">
<head>

<title>Thank You | Digital Foreman</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--concrete:#E3E5E7;--navy:#0E2A4F;--blue:#1F7AD1;--ink:#1B2430;--muted:#4F5B69}
*{box-sizing:border-box}
body{margin:0;background:var(--concrete);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6}
img{max-width:100%;display:block}

h1{font-family:"Archivo","Arial Black",sans-serif;font-weight:900;color:var(--navy);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0}
p{margin:0;color:var(--muted)}
a.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-family:"Archivo",sans-serif;font-weight:800;padding:12px 22px;border-radius:4px}
a.btn:hover{background:#1868B5}
</style>
</head>
<body>
<main>
  <img src="images/digital-foreman-logo.jpg" alt="Digital Foreman logo" width="1024" height="559">
  <h1>Your consultation request is in.</h1>
